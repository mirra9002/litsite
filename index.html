<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
